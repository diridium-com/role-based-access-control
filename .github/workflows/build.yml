#
# Builds and tests every push to main and every pull request. The Maven build
# runs the Java tests and, in the package module, the web administrator's JS
# unit tests (npm test). The e2e job runs the Playwright suite in webadmin/e2e
# against a pinned OIE web client release.
#
# The engine jars this plugin compiles against come from the published OIE
# distribution, the same tarball scripts/install-engine-jars.sh uses for local
# builds. The tarball is cached by tag, so it is downloaded once and reused
# until the pinned version changes.

name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The engine version lives in exactly one place, the POM's mc.version. Hardcoding
      # it here as well meant a future engine bump could leave CI installing 4.6.0 jars
      # while the build compiled against something else, with nothing to catch it.
      # The release tag and tarball name are mechanical transforms of that version, so
      # if OIE ever changes its asset naming the download 404s loudly rather than
      # resolving something stale.
      - name: Resolve the engine version from the POM
        id: engine
        run: |
          MC_VERSION="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=mc.version -DforceStdout)"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mc.version from pom.xml"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=oie_unix_${MC_VERSION//./_}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Cache OIE distribution
        id: oie-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.engine.outputs.tarball }}
          key: oie-dist-${{ steps.engine.outputs.tag }}

      - name: Download OIE distribution
        if: steps.oie-cache.outputs.cache-hit != 'true'
        env:
          OIE_TAG: ${{ steps.engine.outputs.tag }}
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
        run: curl -fSL -o "$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"

      # The same five jars scripts/install-engine-jars.sh installs locally.
      - name: Install engine jars into the local Maven repo
        env:
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
          MC_VERSION: ${{ steps.engine.outputs.mc_version }}
        run: |
          tar xzf "$OIE_TARBALL" \
            oie/server-lib/mirth-server.jar \
            oie/server-lib/mirth-crypto.jar \
            oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-server.jar \
            oie/client-lib/mirth-client.jar
          for pair in \
            "mirth-server:oie/server-lib/mirth-server.jar" \
            "mirth-crypto:oie/server-lib/mirth-crypto.jar" \
            "mirth-client-core:oie/server-lib/mirth-client-core.jar" \
            "donkey-server:oie/server-lib/donkey/donkey-server.jar" \
            "mirth-client:oie/client-lib/mirth-client.jar"; do
            a="${pair%%:*}"; p="${pair#*:}"
            mvn -q org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$p" -DgroupId=com.mirth.connect -DartifactId="$a" -Dversion="$MC_VERSION" -Dpackaging=jar
          done

      - name: Build and test
        run: mvn -B -ntp clean verify

      # A green build with zero tests run is the failure this guards against:
      # surefire is pinned in the POM, but a pin can be dropped and nothing
      # about the build output would look wrong.
      - name: Confirm tests actually ran
        run: |
          reports=$(find . -path '*/target/surefire-reports/*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No surefire reports were produced. The test suite did not run."
            exit 1
          fi
          echo "surefire report files: $reports"

  # Browser tests: the real built plugin.js loaded into the OIE web client, with
  # the engine's REST API mocked in the browser (webadmin/e2e/mock.js), so no
  # engine is needed. The web client is pinned to a release tag; bump it when a
  # new web client release ships and the suite passes against it.
  e2e:
    runs-on: ubuntu-latest
    env:
      OIE_WEB_CLIENT_REF: v1.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gibson9583/oie-web-client
          ref: ${{ env.OIE_WEB_CLIENT_REF }}
          path: oie-web-client

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Build the web client
        working-directory: oie-web-client
        run: |
          npm ci
          npm run build -w web-administrator

      - name: Build the plugin's web bundle
        working-directory: webadmin
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        working-directory: webadmin
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suite
        working-directory: webadmin
        env:
          WEBADMIN_DIR: ${{ github.workspace }}/oie-web-client
        run: npx playwright test

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            webadmin/playwright-report
            webadmin/test-results
          retention-days: 7
